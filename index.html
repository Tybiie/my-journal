<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Journal</title>
    <style>
      :root {
        --bg: #37473c;
        --card: #dcdabf;
        --text: #0e100e;
        --muted: #37473c;
        --accent: #92ae93;
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        justify-content: center;
      }
      .container {
        width: 100%;
        max-width: 550px;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }
      .input-box {
        background: var(--card);
        border-radius: 12px;
        padding: 1rem;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      /* BARRE DE SÉLECTION D'ÉMOTIONS */
      .mood-picker {
        display: flex;
        justify-content: space-between;
        gap: 0.5rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .mood-btn {
        background: transparent;
        border: 2px solid transparent;
        padding: 0.4rem;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          transform 0.2s,
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .mood-btn:hover {
        transform: scale(1.15);
      }
      .mood-btn.selected {
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.15);
        transform: scale(1.25);
        box-shadow: 0 0 12px var(--accent); /* Effet néon Y2K */
      }
      textarea {
        width: 100%;
        height: 120px;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 1rem;
        resize: vertical;
        outline: none;
        box-sizing: border-box;
      }
      button#pubBtn {
        align-self: flex-end;
        background: var(--accent);
        color: #000;
        border: none;
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:disabled {
        opacity: 0.5;
      }
      .feed {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .entry {
        background: var(--card);
        padding: 1rem;
        border-radius: 8px;
        border-left: 4px solid var(--entry-color, var(--accent));
      }
      .timestamp {
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .entry-emoji {
        font-size: 1.1rem;
      }
      .content {
        white-space: pre-wrap;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="input-box">
        <!-- BARRE Y2K + ÉTOILE AU DÉBUT -->
        <div class="mood-picker">
          <!-- Sparkles (Par défaut) -->
          <button
            class="mood-btn selected"
            data-emoji="✨"
            data-color="#83A4E1"
            onclick="selectMood(this)"
          >
            <img
              src="https://api.iconify.design/lucide:sparkles.svg?color=%2338bdf8"
              width="24"
              height="24"
              alt="Sparkles"
            />
          </button>

          <!-- Happy -->
          <button
            class="mood-btn"
            data-emoji="😄"
            data-color="#99F7AB"
            onclick="selectMood(this)"
          >
            <img
              src="https://api.iconify.design/lucide:smile.svg?color=%2300ff66"
              width="24"
              height="24"
              alt="Happy"
            />
          </button>

          <!-- Drôle -->
          <button
            class="mood-btn"
            data-emoji="🤪"
            data-color="#FF9C66"
            onclick="selectMood(this)"
          >
            <img
              src="https://api.iconify.design/lucide:laugh.svg?color=%23ff6600"
              width="24"
              height="24"
              alt="Drôle"
            />
          </button>

          <!-- Sad -->
          <button
            class="mood-btn"
            data-emoji="😔"
            data-color="#887DB2"
            onclick="selectMood(this)"
          >
            <img
              src="https://api.iconify.design/lucide:frown.svg?color=%237000ff"
              width="24"
              height="24"
              alt="Sad"
            />
          </button>

          <!-- Love -->
          <button
            class="mood-btn"
            data-emoji="💖"
            data-color="#DD9AC2"
            onclick="selectMood(this)"
          >
            <img
              src="https://api.iconify.design/lucide:heart.svg?color=%23ff007f"
              width="24"
              height="24"
              alt="Love"
            />
          </button>

          <!-- En Tabarnak -->
          <button
            class="mood-btn"
            data-emoji="🤬"
            data-color="#DA5552"
            onclick="selectMood(this)"
          >
            <img
              src="https://api.iconify.design/lucide:flame.svg?color=%23ff0000"
              width="24"
              height="24"
              alt="En Tabarnak"
            />
          </button>
        </div>

        <textarea
          id="journalInput"
          placeholder="Write today's entry..."
        ></textarea>
        <button id="pubBtn" onclick="saveEntry()">Publish</button>
      </div>
      <div class="feed" id="journalFeed">Loading entries...</div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://qejddvbexslfkrtacsrv.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlamRkdmJleHNsZmtydGFjc3J2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNjc0MDAsImV4cCI6MjEwMjc0MzQwMH0.2MBZ8R_NBJDU60IgYMQLpPza_OhfEtfM0uDh078W_fw";

      let db;
      let currentEmoji = "✨";
      let currentColor = "#38bdf8";

      if (window.supabase) {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        loadEntries();
      }

      function selectMood(btn) {
        document
          .querySelectorAll(".mood-btn")
          .forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");

        currentEmoji = btn.getAttribute("data-emoji");
        currentColor = btn.getAttribute("data-color");

        document.documentElement.style.setProperty("--accent", currentColor);
      }

      async function loadEntries() {
        const feed = document.getElementById("journalFeed");
        const { data, error } = await db
          .from("entries")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) {
          feed.innerHTML = `<div style="color:#ef4444">Error loading entries: ${error.message}</div>`;
          return;
        }

        if (!data || data.length === 0) {
          feed.innerHTML = `<div style="color:var(--muted)">No entries yet. Write something above!</div>`;
          return;
        }

        feed.innerHTML = data
          .map(
            (e) => `
          <div class="entry" style="--entry-color: ${e.color || "#38bdf8"};">
            <div class="timestamp">
              <span class="entry-emoji">${e.emoji || "✨"}</span>
              <span>${new Date(e.created_at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}</span>
            </div>
            <div class="content">${escapeHtml(e.content)}</div>
          </div>
        `,
          )
          .join("");
      }

      async function saveEntry() {
        const input = document.getElementById("journalInput");
        const btn = document.getElementById("pubBtn");
        const text = input.value.trim();
        if (!text) return;

        btn.disabled = true;
        btn.textContent = "Saving...";

        const { error } = await db.from("entries").insert([
          {
            content: text,
            emoji: currentEmoji,
            color: currentColor,
          },
        ]);

        btn.disabled = false;
        btn.textContent = "Publish";

        if (error) {
          alert("Error saving: " + error.message);
        } else {
          input.value = "";
          loadEntries();
        }
      }

      function escapeHtml(str) {
        return str.replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[m],
        );
      }
    </script>
  </body>
</html>
